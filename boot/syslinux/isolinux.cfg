UI menu.c32
PROMPT 0
TIMEOUT 50
DEFAULT llm95

MENU TITLE LLM-95 OS LIVE BOOTLOADER (ISOLINUX v6.04)
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffffff #a0000000 std
MENU COLOR sel          7;37;40 #e0000000 #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std

LABEL llm95
    MENU LABEL ^1. Boot LLM-95 OS (Default: Metal 3 VirtIO-GPU & CoreAudio)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs-virtio.img quiet splash virtio_gpu=metal3 virtio_snd=coreaudio console=ttyS0 console=tty0 root=/dev/vda1 rw

LABEL safe
    MENU LABEL ^2. Boot LLM-95 OS (Safe Mode: VESA 640x480 VGA)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs-virtio.img nomodeset vga=771 single root=/dev/vda1 rw

LABEL debug
    MENU LABEL ^3. Boot LLM-95 OS (Verbose Kernel Debug)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initramfs-virtio.img debug earlyprintk=ttyS0,115200 console=ttyS0 console=tty0 root=/dev/vda1 rw

LABEL memtest
    MENU LABEL ^4. Memory Hardware Diagnostic (MemTest95)
    KERNEL /boot/memtest.bin
